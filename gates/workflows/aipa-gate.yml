# ai-proj-arch gate: no verification plan, no start.
# Installed by ai-proj-arch provisioning. Agents (the bot App) cannot change
# anything under .github/workflows/, and pull_request_target runs this file and
# its script from the base branch, so a pull request cannot alter its own gate.
name: aipa-gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aipa-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verification-plan:
    # This name is the required status check: gate/verification-plan.
    name: gate/verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the BASE branch (the default for pull_request_target).
      # Never check out the pull request's head here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/aipa
          persist-credentials: false
      - name: Check the linked stories
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/workflows/aipa/verification-gate.sh
