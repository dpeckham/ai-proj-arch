# ai-proj-arch project settings. Read by the work loop from main, so changes
# take effect once merged. Provisioning creates this file once and never
# overwrites it.

[harness]
# Which harness runs each role: "claude" or "codex". pm is the interactive
# session `aipa shell` starts; the others run in the work loop.
pm = "claude"
coder = "claude"
qa = "claude"
eng = "claude"
ux = "claude"

[loop]
# Fix rounds the Coder gets for review findings before the story is blocked
# for the CEO.
review_rounds = 3
